<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Articles</h1>

    <a th:href="@{/articles/new}" class="btn">Add Article</a>
    <a th:href="@{/}" class="btn btn-secondary">Home</a>

    <div class="card" th:each="article : ${articles}">
        <h3 th:text="${article.title}"></h3>
        <p th:text="${#strings.abbreviate(article.content, 150)}"></p>

        <a th:href="@{/articles/{id}(id=${article.id})}">Read More</a>
        <a th:href="@{/articles/edit/{id}(id=${article.id})}">Edit</a>
        <a th:href="@{/articles/delete/{id}(id=${article.id})}"
           onclick="return confirm('Delete this article?')">Delete</a>
    </div>
</div>
</body>
</html>
