<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id == null ? 'Add Product' : 'Edit Product'}"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1 th:text="${product.id == null ? 'Add Product' : 'Edit Product'}"></h1>

    <form th:action="@{/products/save}"
          th:object="${product}"
          method="post">

        <!-- Hidden field to keep the ID when editing -->
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label>Name</label>
            <input type="text"
                   th:field="*{name}"
                   class="form-control"
                   required>
        </div>

        <div class="form-group">
            <label>Price</label>
            <input type="number"
                   step="0.01"
                   th:field="*{price}"
                   class="form-control"
                   required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea th:field="*{description}"
                      class="form-control"
                      rows="5"></textarea>
        </div>

        <button type="submit" class="btn">
            Save Product
        </button>

        <a th:href="@{/products}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>

</body>
</html>
